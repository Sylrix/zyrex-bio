# Netlify serves the site at the domain root, so there is no base path here —
# unlike the GitHub Pages deploy, which lives under /zyrex-bio and sets
# NEXT_PUBLIC_BASE_PATH accordingly in its workflow.
#
# NEXT_PUBLIC_SITE_URL must match whatever domain this deploy answers on, or
# every canonical, JSON-LD @id, sitemap entry and product-feed link points at a
# URL that does not resolve. Override it in the Netlify UI when a custom domain
# is attached.

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"
  NEXT_PUBLIC_BASE_PATH = ""
  # Netlify runs its own `npm run build`, so this has to be set here — not just
  # passed to a local build before `netlify deploy`, which the remote build
  # then overwrites. Change it to the custom domain the moment one is attached.
  NEXT_PUBLIC_SITE_URL = "https://zyrex-bio.netlify.app"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    # Content-hashed filenames, so these can be cached indefinitely.
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
