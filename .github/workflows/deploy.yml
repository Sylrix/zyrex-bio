name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build static site
        env:
          # Pages serves this repo at sylrix.github.io/zyrex-bio, so every
          # asset and link needs that prefix. Moving to the custom domain
          # (www.zyrexbioau.com)? Set this back to '' and add a `public/CNAME`
          # file containing the domain — see the README.
          NEXT_PUBLIC_BASE_PATH: '/zyrex-bio'
          # Must match where the site is served, or every canonical, JSON-LD
          # @id, sitemap entry and feed link points somewhere that 404s.
          NEXT_PUBLIC_SITE_URL: 'https://sylrix.github.io/zyrex-bio'
          NEXT_PUBLIC_WEB3FORMS_KEY: ${{ secrets.WEB3FORMS_KEY }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
